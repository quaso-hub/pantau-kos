<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}God Eye Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Navbar -->
  <nav class="bg-indigo-700 text-white px-6 py-3 flex items-center gap-4 shadow">
    <span class="text-xl font-bold">🔍 God Eye</span>
    <span class="text-indigo-300 text-sm">Kos Monitor · UBAYA</span>
    <a href="/dashboard" class="ml-auto text-sm hover:underline">Dashboard</a>
  </nav>

  <!-- Content -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center text-gray-400 text-xs py-4">
    God Eye v3.1 · god-eye.ikrn.engineer
  </footer>

</body>
</html>
